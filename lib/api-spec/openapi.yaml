openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Management dashboard aggregates
  - name: reports
    description: Reproducible daily management reports
  - name: source-files
    description: Workbook registry and ingestion status
  - name: Auth
    description: Browser and mobile authentication endpoints.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get the management dashboard
      parameters:
        - $ref: "#/components/parameters/ProductionDate"
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /reports/daily/{productionDate}:
    get:
      operationId: getDailyReport
      tags: [reports]
      summary: Get a daily management report
      parameters:
        - $ref: "#/components/parameters/ProductionDatePath"
      responses:
        "200":
          description: Daily report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyReport"
        "404":
          description: Report not available
  /reports/daily/{productionDate}/lineage:
    get:
      operationId: getDailyReportLineage
      tags: [reports]
      summary: Get source lineage for a daily report
      parameters:
        - $ref: "#/components/parameters/ProductionDatePath"
      responses:
        "200":
          description: Lineage references
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LineageReference"
  /source-files:
    get:
      operationId: listSourceFiles
      tags: [source-files]
      summary: List source files and their processing status
      parameters:
        - name: status
          in: query
          schema:
            type: ["string", "null"]
            enum: [RECEIVED, HASHED, PARSING, MAPPING, VALIDATING, IMPORTING, PROCESSED, WARNING, FAILED, DUPLICATE]
        - name: limit
          in: query
          schema:
            type: number
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Source file registry rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SourceFile"
  /source-files/{fileId}:
    get:
      operationId: getSourceFile
      tags: [source-files]
      summary: Get source file metadata and validation issues
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Source file detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceFileDetail"
        "404":
          description: Source file not found
  /source-files/upload:
    post:
      operationId: uploadSourceFile
      tags: [source-files]
      summary: Upload an Excel source file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceFileUpload"
      responses:
        "202":
          description: File accepted for processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceFile"
        "400":
          description: Unsupported or invalid upload
  /source-files/{fileId}/preview:
    get:
      operationId: previewSourceFile
      tags: [source-files]
      summary: Inspect a retained workbook before import
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Workbook inspection and validation preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceFilePreview"
  /source-files/{fileId}/import:
    post:
      operationId: importSourceFile
      tags: [source-files]
      summary: Import a validated workbook into canonical Daily Operations drafts
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Workbook imported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceFileImport"
        "409":
          description: Validation errors or existing-record conflict
  /storage/uploads/request-url:
    post:
      operationId: requestSourceUploadUrl
      tags: [source-files]
      summary: Request a protected App Storage upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageUploadRequest"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageUploadResponse"
        "400":
          description: Unsupported or oversized upload
  /reports/daily/{productionDate}/pdf:
    get:
      operationId: downloadDailyReportPdf
      tags: [reports]
      summary: Download the deterministic application-generated daily report PDF
      parameters:
        - name: productionDate
          in: path
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Daily management report PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: Report not available
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Auth status resolved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"
  /login:
    post:
      tags: [Auth]
      operationId: loginWithDemoCredentials
      summary: Log in with a demo username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"
        "401":
          description: Invalid credentials
  /logout:
    post:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the local demo session
      responses:
        "204":
          description: Session cleared
  /approval-queue:
    get:
      tags: [Auth]
      operationId: getApprovalQueue
      summary: List submitted daily records awaiting manager review
      responses:
        "200":
          description: Approval queue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApprovalQueueItem"
  /approval-queue/{recordId}:
    post:
      tags: [Auth]
      operationId: reviewDailyRecord
      summary: Approve or return a submitted daily record
      parameters:
        - name: recordId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewInput"
      responses:
        "200":
          description: Reviewed record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyOperations"
  /users:
    get:
      tags: [Auth]
      operationId: listUsers
      summary: List local demo users
      responses:
        "200":
          description: Demo users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
    post:
      tags: [Auth]
      operationId: createUser
      summary: Create a local demo user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserInput"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
  /users/{userId}/reset-password:
    post:
      tags: [Auth]
      operationId: resetUserPassword
      summary: Reset a local demo user's password
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInput"
      responses:
        "204":
          description: Password reset
  /audit-logs:
    get:
      tags: [Auth]
      operationId: listAuditLogs
      summary: List recent access and workflow audit events
      responses:
        "200":
          description: Recent audit events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLog"
  /daily-operations/{productionDate}:
    get:
      tags: [dashboard]
      operationId: getDailyOperations
      summary: Get manual daily operations data
      parameters:
        - $ref: "#/components/parameters/ProductionDatePath"
      responses:
        "200":
          description: Manual operations record or null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyOperations"
  /daily-operations:
    post:
      tags: [dashboard]
      operationId: saveDailyOperations
      summary: Save or submit manual daily operations data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DailyOperationsInput"
      responses:
        "200":
          description: Saved operations record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyOperations"
        "400":
          description: Validation failed
components:
  parameters:
    ProductionDate:
      name: date
      in: query
      description: Factory-local production date; defaults to the current factory-local reporting date
      schema:
        type: string
        format: date
    ProductionDatePath:
      name: productionDate
      in: path
      required: true
      schema:
        type: string
        format: date
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AuthUser:
      type: object
      required: [id, username, email, firstName, lastName, profileImageUrl, role, department, isDemo]
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: ["string", "null"]
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        profileImageUrl:
          type: ["string", "null"]
        role:
          type: string
          enum: [PRODUCTION_OPERATOR, QUALITY_OPERATOR, ENGINEERING_OPERATOR, STORES_OPERATOR, MANAGER, ADMIN]
        department:
          type: string
        isDemo:
          type: boolean
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
    LoginInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    ApprovalQueueItem:
      type: object
      required: [id, productionDate, shift, status, submittedBy, submittedAt, department]
      properties:
        id:
          type: string
        productionDate:
          type: string
          format: date
        shift:
          type: string
        status:
          type: string
          enum: [SUBMITTED, UNDER_REVIEW]
        submittedBy:
          type: string
        submittedAt:
          type: string
          format: date-time
        department:
          type: string
    ReviewInput:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [START_REVIEW, APPROVE, REJECT]
        comments:
          type: string
    ResetPasswordInput:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 4
    AuditLog:
      type: object
      required: [id, userId, role, department, action, entityType, createdAt]
      properties:
        id:
          type: string
        userId:
          type: string
        role:
          type: string
        department:
          type: string
        action:
          type: string
        entityType:
          type: string
        entityId:
          type: ["string", "null"]
        details:
          type: ["object", "null"]
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
    AdminUser:
      type: object
      required: [id, username, email, role, department, isDemo, createdAt]
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: string
        role:
          type: string
        department:
          type: string
        isDemo:
          type: boolean
        createdAt:
          type: string
          format: date-time
    CreateUserInput:
      type: object
      required: [username, password, role, department]
      properties:
        username:
          type: string
        password:
          type: string
          minLength: 4
        role:
          type: string
        department:
          type: string
    DailyOperations:
      type: object
      required: [id, factoryId, productionDate, season, shift, status, source, production, quality, efficiency, timeAccount, stoppages, energy, materials]
      properties:
        id:
          type: string
        factoryId:
          type: string
        productionDate:
          type: string
          format: date
        season:
          type: string
        shift:
          type: string
        status:
          type: string
          enum: [DRAFT, SUBMITTED, UNDER_REVIEW, APPROVED]
        source:
          type: string
        production:
          type: object
          additionalProperties: false
        quality:
          type: object
          additionalProperties: false
        efficiency:
          type: object
          additionalProperties: false
        timeAccount:
          type: object
          additionalProperties: false
        stoppages:
          type: array
          items:
            type: object
            additionalProperties: false
        energy:
          type: object
          additionalProperties: false
        materials:
          type: array
          items:
            type: object
            additionalProperties: false
    DailyOperationsInput:
      $ref: "#/components/schemas/DailyOperations"
    DashboardSummary:
      type: object
      required: [factory, productionDate, reportingTimezone, reportingAt, dataStatus, kpis, exceptions, trend, ingestion]
      properties:
        factory:
          type: string
        productionDate:
          type: string
          format: date
        reportingTimezone:
          type: string
          description: IANA timezone used to resolve the reporting date and factory-facing timestamps
        reportingAt:
          type: string
          format: date-time
          description: Current reporting instant; interpret it using reportingTimezone
        dataStatus:
          type: string
          enum: [COMPLETE, PARTIAL, UNAVAILABLE]
        kpis:
          type: array
          items:
            $ref: "#/components/schemas/KpiCard"
        exceptions:
          type: array
          items:
            $ref: "#/components/schemas/ExceptionSummary"
        trend:
          type: array
          items:
            $ref: "#/components/schemas/TrendPoint"
        ingestion:
          $ref: "#/components/schemas/IngestionSummary"
    KpiCard:
      type: object
      required: [code, label, value, unit, status, comparisonLabel, comparisonValue, available]
      properties:
        code:
          type: string
        label:
          type: string
        value:
          type: ["number", "null"]
        unit:
          type: string
        status:
          type: string
          enum: [GOOD, WATCH, CRITICAL, UNAVAILABLE]
        comparisonLabel:
          type: string
        comparisonValue:
          type: ["number", "null"]
        available:
          type: boolean
        sourceCount:
          type: number
          minimum: 0
    ExceptionSummary:
      type: object
      required: [id, severity, title, detail, kpiCode, acknowledged]
      properties:
        id:
          type: string
        severity:
          type: string
          enum: [INFO, WARNING, CRITICAL]
        title:
          type: string
        detail:
          type: string
        kpiCode:
          type: string
        acknowledged:
          type: boolean
    TrendPoint:
      type: object
      required: [date, recovery, caneCrushed, downtime]
      properties:
        date:
          type: string
          format: date
        recovery:
          type: ["number", "null"]
        caneCrushed:
          type: ["number", "null"]
        downtime:
          type: ["number", "null"]
    IngestionSummary:
      type: object
      required: [processed, warnings, failed, lastUpdated]
      properties:
        processed:
          type: number
        warnings:
          type: number
        failed:
          type: number
        lastUpdated:
          type: string
          format: date-time
    DailyReport:
      type: object
      required: [id, factory, productionDate, reportingTimezone, reportingAt, reportVersion, executiveSummary, scorecard, exceptions, sources]
      properties:
        id:
          type: string
        factory:
          type: string
        productionDate:
          type: string
          format: date
        reportingTimezone:
          type: string
          description: IANA timezone used for the selected report period and factory-facing timestamps
        reportingAt:
          type: string
          format: date-time
          description: Current reporting instant; interpret it using reportingTimezone
        reportVersion:
          type: string
        generatedAt:
          type: string
          format: date-time
        executiveSummary:
          type: string
        scorecard:
          type: array
          items:
            $ref: "#/components/schemas/ReportKpi"
        exceptions:
          type: array
          items:
            $ref: "#/components/schemas/ExceptionSummary"
        downtime:
          type: array
          items:
            $ref: "#/components/schemas/DowntimeContributor"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/LineageReference"
    ReportKpi:
      type: object
      required: [code, label, today, unit, yesterday, baseline, baselineLabel, status]
      properties:
        code:
          type: string
        label:
          type: string
        today:
          type: ["number", "null"]
        unit:
          type: string
        yesterday:
          type: ["number", "null"]
        baseline:
          type: ["number", "null"]
        baselineLabel:
          type: string
        status:
          type: string
          enum: [GOOD, WATCH, CRITICAL, UNAVAILABLE]
    DowntimeContributor:
      type: object
      required: [label, hours, share]
      properties:
        label:
          type: string
        hours:
          type: number
        share:
          type: number
    LineageReference:
      type: object
      required: [kpiCode, canonicalField, fileId, filename, sheet, sourceRow, sourceColumn, rawValue, formula]
      properties:
        kpiCode:
          type: string
        canonicalField:
          type: string
        fileId:
          type: string
        filename:
          type: string
        sheet:
          type: string
        sourceRow:
          type: number
        sourceColumn:
          type: string
        rawValue:
          type: string
        formula:
          type: string
    SourceFile:
      type: object
      required: [id, filename, reportType, reportingDate, status, uploadedAt, sizeBytes, sha256, synthetic]
      properties:
        id:
          type: string
        filename:
          type: string
        reportType:
          type: string
        reportingDate:
          type: ["string", "null"]
          format: date
        status:
          type: string
          enum: [RECEIVED, HASHED, PARSING, MAPPING, VALIDATING, IMPORTING, PROCESSED, WARNING, FAILED, DUPLICATE]
        uploadedAt:
          type: string
          format: date-time
        sizeBytes:
          type: number
        sha256:
          type: string
        synthetic:
          type: boolean
        issueCount:
          type: number
    SourceFileDetail:
      allOf:
        - $ref: "#/components/schemas/SourceFile"
        - type: object
          required: [sheets, issues, processingHistory]
          properties:
            sheets:
              type: array
              items:
                type: string
            issues:
              type: array
              items:
                $ref: "#/components/schemas/ValidationIssue"
            processingHistory:
              type: array
              items:
                $ref: "#/components/schemas/ProcessingEvent"
    ValidationIssue:
      type: object
      required: [severity, code, message]
      properties:
        severity:
          type: string
          enum: [INFO, WARNING, ERROR]
        code:
          type: string
        message:
          type: string
        location:
          type: ["string", "null"]
    ProcessingEvent:
      type: object
      required: [status, at]
      properties:
        status:
          type: string
        at:
          type: string
          format: date-time
        note:
          type: ["string", "null"]
    SourceFileUpload:
      type: object
      required: [objectPath, filename, sizeBytes]
      properties:
        objectPath:
          type: string
          minLength: 1
        filename:
          type: string
          minLength: 1
        sizeBytes:
          type: number
          minimum: 0
        contentType:
          type: ["string", "null"]
    StorageUploadRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: number
          minimum: 1
        contentType:
          type: string
    StorageUploadResponse:
      type: object
      required: [uploadURL, objectPath, metadata]
      properties:
        uploadURL:
          type: string
        objectPath:
          type: string
        metadata:
          type: object
          required: [name, size, contentType]
          properties:
            name:
              type: string
            size:
              type: number
            contentType:
              type: string
    SourceFilePreview:
      type: object
      required: [id, filename, status, sheets, mapping, previewRows, issues, validRowCount, errorCount, warningCount]
      properties:
        id:
          type: string
        filename:
          type: string
        status:
          type: string
        parserVersion:
          type: ["string", "null"]
        mappingVersion:
          type: ["string", "null"]
        sheets:
          type: array
          items:
            type: object
            required: [name, headers, rowCount, sampleRows, candidate]
            properties:
              name:
                type: string
              headers:
                type: array
                items:
                  type: string
              rowCount:
                type: number
              sampleRows:
                type: array
                items:
                  type: object
                  additionalProperties:
                    type: string
              candidate:
                type: boolean
        mapping:
          type: object
          additionalProperties:
            type: string
        previewRows:
          type: array
          items:
            type: object
            additionalProperties:
              type: string
        issues:
          type: array
          items:
            $ref: "#/components/schemas/ValidationIssue"
        validRowCount:
          type: number
        errorCount:
          type: number
        warningCount:
          type: number
    SourceFileImport:
      type: object
      required: [sourceFileId, status, importedCount, alreadyImported]
      properties:
        sourceFileId:
          type: string
        status:
          type: string
        importedCount:
          type: number
        alreadyImported:
          type: boolean

